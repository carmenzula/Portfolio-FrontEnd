<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" description="Primera página web">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <title>Primera Página Web</title>
    <style>
    body {
        font-family: "Lucida Console", "Courier New", monospace;
        background: linear-gradient(to right, rgb(189, 255, 224), rgb(255, 233, 246));
        padding: 0;
        margin: 0;
    }

    header {
        text-align: center;
    }

    ul {
        list-style-type: none;
        margin: 0px;
        padding: 0;
        overflow: hidden;
        background-color: #333;
    }

    li {
        float: left;
    }

    li a {
        display: block;
        color: white;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }

    li a:hover:not(.active) {
        background-color: #111;
    }

    .active {
        background-color: #ff92d5;
    }

    h1 {
        background-color: black;
        padding: 10px;
        margin: 0;
        color: #ff92d5
        }
    
    label{
        margin: 10px;
    }

    input[type=text],
    input[type=email],
    textarea,
    select {
        width: 100%;
        padding: 12px 20px;
        margin: 10px;
        display: inline-block;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    input[type=submit] {
        width: 100%;
        background-color: #312d0c59;
        color: white;
        padding: 14px 20px;
        margin: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    input[type=submit]:hover {
        background-color: #7ef31e;
    }

    div.contenedor-formulario {
        border-radius: 5px;
        background-color: #f2f2f2;
        padding: 20px;
    }
    .footer {
        background-color: #333;
        color: #FFF;
        padding: 10px;
        text-align: center;
        clear: both;
    }
    </style>
</head>
<body>
    <header>
        <h1>Primera Página web</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="preferencias.html">Preferencias</a></li>
                <li><a href="audiovisuales.html">Audiovisuales</a></li>
                <li><a class="active" href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <div>
        <form action="">
            <label for="name">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribi tu nombre" required>

            <label for="name">Apellido</label>
            <input type="text" id="Apellido" name="Apellido" placeholder="Escribi tu apellido" required>

            <label for="email">Email</label>
            <input type="email" id="mail" name="mail" placeholder="Correo Electrónico">

            <label for="pais">País: </label>
            <select name="pais" id="pais">
                <option value="Argentina" selected>Argentina</option>
                <option value="Uruguay">Uruguay</option>
                <option value="Chile">Chile</option>
                <option value="Paraguay">Paraguay</option>
            </select>
            <label for="texarea">Comentario:</label>
            <textarea name="comentario" id="comentario" placeholder="Escribe aquí tu comentario"></textarea>
            <label for="motivo">Motivo de contacto: </label>
            <input type="radio" id="motivo" name="motivo"><i>Aprender más</i>
            <input type="radio" id="motivo" name="motivo"><i>Comprar curso</i>
            <input type="radio" id="motivo" name="motivo"><i>Comprar plantas</i>
            <input type="radio" id="motivo" name="motivo"><i>Otros</i>
            <input type="submit" value="Enviar">

        </form>
    </div>

    <footer class="footer">
        <p>Derechos reservados &copy; 2025</p>
    </footer>
</body>
</html>
